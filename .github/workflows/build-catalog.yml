name: Build catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**/*.tsv'
      - 'docs/catalog/build_catalog.py'
      - '.github/workflows/build-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build TSV catalog
        run: python3 docs/catalog/build_catalog.py

      - name: Commit generated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/catalog/shadowwar1938_catalog.tsv
          git diff --cached --quiet || git commit -m 'Aktualizován jednotný katalog SW1938'
          git push
